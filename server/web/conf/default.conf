# 검수 웹 — 외부에 노출되는 유일한 컨테이너 (Tailscale Funnel 대상)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 마크업 POST 본문은 작음. 넉넉히 5m.
    client_max_body_size 5m;

    # /api/admin_outline 같은 큰 JSON 응답 압축. 정적 자산도 함께.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/javascript application/geo+json
               text/css text/plain image/svg+xml;
    gzip_vary on;

    # 정적 프론트 (MapLibre SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 검수 웹 API → FastAPI backend
    location /api/ {
        # 경계 제출(PUT /api/boundary)은 읍면 전체를 GeoJSON 한 번에 보냄 —
        # 폴리곤 수·정밀도에 따라 수십 MB. 전역 5m 로는 큰 읍면이 거부된다.
        client_max_body_size 100m;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 검수 웹 (admin_cd 계정 + JWT) → FastAPI backend (/web/*)
    location /web/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MinIO S3 API → 대전 플러그인이 boto3(path-style)로 COG/원본 업로드.
    # rewrite 로 /s3/ prefix 를 떼어 MinIO 에 전달.
    # ⚠ 클라이언트는 endpoint_url 에 /s3 를 넣지 말고, 서명 후 before-send 훅으로
    #   경로에 /s3 를 덧붙여야 SigV4 서명이 맞는다 (보고서의 플러그인 설정 참고).
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 대용량 멀티파트 업로드: 본문 크기 무제한, 버퍼링 끔, 타임아웃 넉넉히
        client_max_body_size 0;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # vworld WMTS 베이스맵 proxy (브라우저는 same-origin /vworld 로 호출).
    # 키는 프론트엔드 VITE_VWORLD_KEY 에 박혀 있어 별도 인증 헤더 불필요.
    location /vworld/ {
        proxy_pass https://api.vworld.kr/;
        proxy_set_header Host              api.vworld.kr;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
        # 타일은 변하지 않음 — 1시간 캐시
        expires 1h;
        add_header Cache-Control "public";
    }

    # COG 타일 → titiler (내부 전용 컨테이너). 끝의 / 가 /tiles/ prefix 를 떼어냄.
    location /tiles/ {
        proxy_pass http://titiler:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 타일은 변하지 않으므로 브라우저 캐시 허용
        expires 1h;
        add_header Cache-Control "public";
    }
}
