# 검수 웹 — 외부에 노출되는 유일한 컨테이너 (Tailscale Funnel 대상)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 마크업 POST 본문은 작음. 넉넉히 5m.
    client_max_body_size 5m;

    # 정적 프론트 (MapLibre SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 검수 웹 API → FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 검수 웹 (admin_cd 계정 + JWT) → FastAPI backend (/web/*)
    location /web/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MinIO S3 API → 대전 플러그인이 boto3(path-style)로 COG/원본 업로드.
    # rewrite 로 /s3/ prefix 를 떼어 MinIO 에 전달.
    # ⚠ 클라이언트는 endpoint_url 에 /s3 를 넣지 말고, 서명 후 before-send 훅으로
    #   경로에 /s3 를 덧붙여야 SigV4 서명이 맞는다 (보고서의 플러그인 설정 참고).
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 대용량 멀티파트 업로드: 본문 크기 무제한, 버퍼링 끔, 타임아웃 넉넉히
        client_max_body_size 0;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # COG 타일 → titiler (내부 전용 컨테이너). 끝의 / 가 /tiles/ prefix 를 떼어냄.
    location /tiles/ {
        proxy_pass http://titiler:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 타일은 변하지 않으므로 브라우저 캐시 허용
        expires 1h;
        add_header Cache-Control "public";
    }
}
