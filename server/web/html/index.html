<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>행정리 경계 검수 (Phase 1 smoke)</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <!-- 로그인 오버레이 -->
  <div id="login" class="overlay">
    <form id="login-form" class="login-box">
      <h1>행정리 경계 검수</h1>
      <p class="muted">admin_cd (8자) + 비밀번호로 로그인합니다.<br/>
        ※ 외주 OpenLayers 빌드로 교체될 임시 페이지입니다.</p>
      <input type="text" id="admin_cd" placeholder="admin_cd (8자)" maxlength="8" autocomplete="username" />
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" />
      <button type="submit">로그인</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- 앱 셸 -->
  <div id="app" class="hidden">
    <aside id="sidebar">
      <header>
        <h2>검수 (<span id="who"></span>)</h2>
        <button id="logout" class="link">로그아웃</button>
      </header>

      <div id="tools">
        <h3>경계</h3>
        <button id="reload-boundary">경계 다시 로드</button>
        <div id="boundary-info" class="muted"></div>

        <h3>마크업 smoke</h3>
        <button id="add-markup">샘플 마크업(attr Point) 1건 등록</button>
        <button id="reload-markup">목록 새로고침</button>
        <ul id="markup-list"></ul>
      </div>
    </aside>
    <main><div id="map"></div></main>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
